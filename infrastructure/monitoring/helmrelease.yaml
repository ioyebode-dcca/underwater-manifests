apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=45.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  values:
    grafana:
      adminPassword: admin
      persistence:
        enabled: false
      grafana.ini:
        server:
          root_url: "%(protocol)s://%(domain)s/grafana"
          serve_from_sub_path: true
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /$2
        path: /grafana(/|$)(.*)
        pathType: ImplementationSpecific
        hosts:
          - ""

    prometheus:
      prometheusSpec:
        retention: 7d
        routePrefix: /prometheus
        externalUrl: http://placeholder/prometheus
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: gp2
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /$2
        paths:
          - /prometheus(/|$)(.*)
        pathType: ImplementationSpecific
        hosts:
          - ""

    alertmanager:
      enabled: true